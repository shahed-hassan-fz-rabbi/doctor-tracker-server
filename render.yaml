# Render Blueprint — ISOLATED DEMO runtime service only.
# Apply via Render Dashboard -> New -> Blueprint -> doctor-tracker-server.
# This manifest does NOT touch the existing production service; it creates one
# additional web service: doctor-tracker-server-demo.
#
# Security model (see .env.example and README "Demo Database Isolation"):
#   - DEMO_MONGODB_URI is prompted on creation (sync: false). It MUST use the
#     dedicated read-only Atlas user scoped to doctor-tracker-demo
#     (verify with: node scripts/verifyDemoRuntime.js).
#   - DEMO_JWT_SECRET is generated by Render (generateValue: true).
#   - No Google OAuth credentials, no Admin seed credentials, and no
#     production database URI are allowed on this service.

services:
  - type: web
    name: doctor-tracker-server-demo
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'true'
      - key: DEMO_MONGODB_URI
        sync: false # paste the read-only demo runtime URI (generated by scripts/verifyDemoRuntime.js)
      - key: DEMO_JWT_SECRET
        generateValue: true # unique random secret, never reused from production
      - key: COOKIE_NAME
        value: dt_demo_token
      - key: COOKIE_SECURE
        value: 'true'
      - key: CORS_ORIGINS
        sync: false # set to the exact demo frontend Vercel origin, e.g. https://doctor-tracker-client-demo.vercel.app
      - key: LOG_LEVEL
        value: info
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: 15
      - key: RATE_LIMIT_MAX
        value: 300
      - key: LOGIN_RATE_LIMIT_WINDOW_MINUTES
        value: 15
      - key: LOGIN_RATE_LIMIT_MAX
        value: 20
